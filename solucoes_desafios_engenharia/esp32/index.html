<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Meteorológico Orbital - ESP32</title>

    <style>
        :root {
            --color-space: #050510;
            --color-panel: rgba(11, 12, 22, 0.9);
            --color-neon: #00f0ff;
            --color-warning: #ff0055;
            --color-blue-400: #60a5fa;
            --color-blue-500: #3b82f6;
            --color-blue-600: #2563eb;
            --color-green-400: #4ade80;
            --color-green-500: #22c55e;
            --color-gray-300: #d1d5db;
            --color-gray-400: #9ca3af;
            --color-gray-500: #6b7280;
            --color-gray-700: #374151;
            --color-gray-800: #1f2937;

            /* Fallback offline fonts */
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-space);
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--color-gray-300);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 1rem;
        }

        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(0, 240, 255, 0) 0%, rgba(0, 240, 255, 0.1) 50%, rgba(0, 240, 255, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scanline {
            0% {
                bottom: 100%;
            }

            100% {
                bottom: -100px;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }

        .container {
            width: 100%;
            max-width: 42rem;
            background-color: var(--color-panel);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        /* Header */
        .header {
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
        }

        .header-dot {
            position: absolute;
            top: 0;
            width: 8px;
            height: 8px;
            background-color: var(--color-neon);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .header-dot.left {
            left: 0;
        }

        .header-dot.right {
            right: 0;
        }

        .header h1 {
            font-family: var(--font-sans);
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(to right, var(--color-neon), var(--color-blue-500));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .header h1 {
                font-size: 1.875rem;
            }
        }

        .header p {
            color: rgba(0, 240, 255, 0.7);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Card Section */
        .card {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 1.5rem;
            border: 1px solid var(--color-gray-800);
            border-radius: 0.375rem;
            position: relative;
            overflow: hidden;
            margin-bottom: 2.5rem;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(0, 240, 255, 0.4);
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card.neon-hover::before {
            background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.5), transparent);
        }

        .card.blue-hover::before {
            background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.5), transparent);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-title {
            font-family: var(--font-sans);
            font-size: 1.125rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title.neon {
            color: var(--color-neon);
        }

        .card-title.blue {
            color: var(--color-blue-400);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.neon {
            background-color: var(--color-neon);
        }

        .dot.blue {
            background-color: var(--color-blue-500);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--color-gray-500);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* Grid inputs */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .input-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--color-gray-500);
            font-weight: bold;
            margin-bottom: 0.25rem;
            display: block;
        }

        .input-group input[type="number"] {
            width: 100%;
            background-color: var(--color-space);
            border: 1px solid var(--color-gray-700);
            color: var(--color-neon);
            padding: 0.5rem;
            border-radius: 0.25rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-group input::placeholder {
            color: var(--color-gray-700);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--color-neon);
            box-shadow: 0 0 0 1px var(--color-neon);
        }

        /* Buttons */
        .btn {
            width: 100%;
            font-family: var(--font-sans);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            border: 1px solid transparent;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-neon {
            background-color: rgba(0, 240, 255, 0.1);
            border-color: var(--color-neon);
            color: var(--color-neon);
        }

        .btn-neon:hover:not(:disabled) {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6), inset 0 0 10px rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.8);
        }

        .btn-blue {
            background-color: rgba(30, 58, 138, 0.4);
            border-color: var(--color-blue-500);
            color: var(--color-blue-400);
            padding: 0.5rem 1.5rem;
        }

        .btn-blue:hover:not(:disabled) {
            background-color: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .btn-green {
            background-color: rgba(20, 83, 45, 0.3);
            border-color: var(--color-green-500);
            color: var(--color-green-400);
            margin-top: 1rem;
            display: none;
        }

        .btn-green:hover {
            background-color: rgba(34, 197, 94, 0.2);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        /* Result Box */
        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(5, 5, 16, 0.8);
            border-left: 2px solid var(--color-neon);
            color: rgba(0, 240, 255, 0.9);
            font-size: 0.875rem;
            display: none;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 1);
            line-height: 1.5;
        }

        .text-warning {
            color: var(--color-warning);
        }

        /* File Upload */
        .upload-row {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        @media (min-width: 768px) {
            .upload-row {
                flex-direction: row;
            }

            .btn-blue {
                width: auto;
            }
        }

        input[type="file"] {
            width: 100%;
            font-size: 0.875rem;
            color: var(--color-gray-400);
            background-color: var(--color-space);
            border: 1px solid var(--color-gray-700);
            padding: 0.25rem;
            border-radius: 0.25rem;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            margin-right: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: 0;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: var(--color-gray-800);
            color: var(--color-neon);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--color-gray-700);
        }

        /* Progress */
        .progress-container {
            width: 100%;
            background-color: var(--color-space);
            border: 1px solid var(--color-gray-700);
            border-radius: 2px;
            margin-top: 1.25rem;
            height: 1rem;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--color-blue-600), var(--color-neon));
            transition: width 0.2s ease;
            position: relative;
        }

        .progress-bar.error {
            background: var(--color-warning);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI4IiBmaWxsPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMikiLz4KPC9zdmc+');
            opacity: 0.5;
        }

        .status-txt {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--color-gray-400);
            margin-top: 0.5rem;
            text-align: right;
            letter-spacing: 0.05em;
        }

        .text-green-400 {
            color: var(--color-green-400);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-panel);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-neon);
        }
    </style>
</head>

<body>
    <div class="scanline"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-dot left"></div>
            <div class="header-dot right"></div>
            <h1>Edge computing module</h1>
            <p>Uplink de processamento orbital • Setor Meteorológico</p>
        </div>

        <!-- Seção Manual -->
        <div class="card neon-hover">
            <h2 class="card-title neon">
                <span class="dot neon"></span> Telemetria Individual
            </h2>

            <div class="input-grid">
                <div class="input-group">
                    <label>Temp (°C)</label>
                    <input type="number" id="temp" step="0.1" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>Umidade (%)</label>
                    <input type="number" id="umidade" step="0.1" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>Vento (km/h)</label>
                    <input type="number" id="vento" step="0.1" placeholder="0.0">
                </div>
            </div>

            <button onclick="calcularManual()" class="btn btn-neon">
                Processar no Core ESP32
            </button>

            <div id="resultado" class="result-box"></div>
        </div>

        <!-- Seção Lote (CSV) -->
        <div class="card blue-hover">
            <h2 class="card-title blue">
                <span class="dot blue"></span> Processamento de Lote (CSV)
            </h2>
            <p class="subtitle">Max Payload: 1MB</p>

            <div class="upload-row">
                <input type="file" id="csvFile" accept=".csv">
                <button onclick="processarCSV()" class="btn btn-blue">
                    Uplink
                </button>
            </div>

            <!-- Progresso -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p id="statusTxt" class="status-txt"></p>

            <button id="downloadBtn" class="btn btn-green">
                ⬇ Download Dados Processados
            </button>
        </div>
    </div>

    <script>
        // Conexão WebSocket
        let ws;
        function initWebSocket() {
            const gateway = `ws://${window.location.hostname}:81/`;
            ws = new WebSocket(gateway);

            ws.onmessage = function (event) {
                const data = JSON.parse(event.data);
                if (data.progress) {
                    const barra = document.getElementById('progressBar');
                    const status = document.getElementById('statusTxt');

                    barra.style.width = data.progress + '%';
                    status.innerText = `PROCESSANDO NO CORE: ${data.progress}%`;

                    if (data.done) {
                        status.innerText = "PROCESSAMENTO CONCLUÍDO";
                        status.classList.add('text-green-400');
                    }
                }
            };
        }

        // Inicia o WS ao carregar a página
        window.addEventListener('load', initWebSocket);

        function calcularManual() {
            const T = document.getElementById('temp').value;
            const UR = document.getElementById('umidade').value;
            const V = document.getElementById('vento').value;

            if (!T || !UR || !V) {
                alert("SISTEMA: PREENCHA TODOS OS CAMPOS PARA TELEMETRIA.");
                return;
            }

            const btn = document.querySelector('button[onclick="calcularManual()"]');
            const oldText = btn.innerText;
            btn.innerText = "PROCESSANDO...";
            btn.disabled = true;

            fetch(`/calcular?T=${T}&UR=${UR}&V=${V}`)
                .then(res => res.json())
                .then(data => {
                    const resDiv = document.getElementById('resultado');
                    resDiv.style.display = 'block';
                    if (data.error) {
                        resDiv.innerHTML = `<span class="text-warning">ERRO: ${data.error}</span>`;
                    } else {
                        resDiv.innerHTML = `> PONTO ORVALHO: ${data.po} °C<br>> WIND CHILL: ${data.wc}<br>> HEAT INDEX: ${data.hi}`;
                    }
                })
                .catch(err => {
                    const resDiv = document.getElementById('resultado');
                    resDiv.style.display = 'block';
                    resDiv.innerHTML = `<span class="text-warning">FALHA NO UPLINK: ${err}</span>`;
                })
                .finally(() => {
                    btn.innerText = oldText;
                    btn.disabled = false;
                });
        }

        function processarCSV() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) { alert("SISTEMA: SELECIONE UM ARQUIVO CSV PARA UPLINK."); return; }

            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'none';
            const barra = document.getElementById('progressBar');
            const status = document.getElementById('statusTxt');

            barra.className = 'progress-bar'; // reset class
            barra.style.width = '0%';

            const formData = new FormData();
            formData.append("file", file);

            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/processar_csv", true);
            xhr.responseType = "blob";

            // Barra de progresso para a fase de UPLOAD
            xhr.upload.onprogress = function (e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    if (percent < 100) {
                        barra.style.width = percent + '%';
                        status.innerText = `UPLINK: ${percent}%`;
                    } else {
                        barra.style.width = '0%';
                        status.innerText = "INICIANDO PROCESSAMENTO ESPACIAL...";
                    }
                }
            };

            xhr.onload = function () {
                if (this.status === 200) {
                    const blob = this.response;
                    const url = URL.createObjectURL(blob);

                    const btn = document.getElementById('downloadBtn');
                    btn.onclick = () => {
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'payload_processado.csv';
                        a.click();
                    };
                    btn.style.display = 'block';
                } else {
                    status.innerText = "FALHA NO ESP32: HTTP " + this.status;
                    status.classList.add('text-warning');
                    barra.classList.add('error');
                }
            };

            xhr.send(formData);
        }
    </script>
</body>

</html>
